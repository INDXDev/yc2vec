name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pipeline
        run: uv sync --all-extras

      # The published dataset is validated before it ships. A failing gate
      # blocks the deploy rather than degrading the live site.
      - name: Validate published dataset
        run: |
          if [ -d data/public ]; then
            uv run yc2vec validate || exit 1
          else
            echo "No generated dataset committed; the fixture release will be published."
          fi

      - name: Stage dataset for the site
        run: |
          mkdir -p frontend/public/data
          if [ -d data/public/v1 ]; then
            rm -rf frontend/public/data/v1
            cp -r data/public/v1 frontend/public/data/v1
            [ -f data/quality.json ] && cp data/quality.json frontend/public/data/v1/quality.json
            echo "published the generated dataset"
          else
            echo "publishing the committed fixture dataset"
          fi

      - run: npm ci
        working-directory: frontend

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Project Pages serve under /<repo>/. Set CUSTOM_DOMAIN to "1" in
          # repository variables when serving from a custom domain at the root.
          VITE_BASE_PATH: ${{ vars.CUSTOM_DOMAIN == '1' && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Add .nojekyll
        # Without this, GitHub Pages' Jekyll pass drops files and directories
        # whose names begin with an underscore.
        run: touch frontend/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
