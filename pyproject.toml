[project]
name = "yc2vec"
version = "0.1.0"
description = "Open-data semantic map of Y Combinator companies, built with a fully local LLM stack."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "YC2Vec contributors" }]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "httpx>=0.27",
    "polars>=1.17",
    "pyarrow>=18",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.7",
    "selectolax>=0.3.21",
    "rich>=13.9",
    "jsonschema>=4.23",
    "orjson>=3.10",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
    "pytest-asyncio>=0.24",
]

[project.scripts]
yc2vec = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
# E501: line length is handled by the formatter.
# B008: Typer's Option/Argument defaults are function calls by design.
# N818: `raise UnsafeUrl(...)` reads better than `raise UnsafeUrlError(...)`.
ignore = ["E501", "B008", "N818"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = "^(frontend|data)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-model tests are opt-in: `uv run pytest -m ollama` runs them.
addopts = "-q -m 'not ollama'"
markers = ["ollama: requires a live Ollama server (skipped by default)"]
asyncio_mode = "auto"
